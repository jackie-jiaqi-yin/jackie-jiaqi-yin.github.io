<div class="preview-modal" data-preview-dialog hidden aria-hidden="true">
  <div class="preview-modal__backdrop" data-preview-close></div>
  <div class="preview-modal__panel" role="dialog" aria-modal="true" aria-labelledby="preview-modal-title">
    <button class="preview-modal__close" type="button" data-preview-close aria-label="Close preview">
      <i class="fas fa-times" aria-hidden="true"></i>
    </button>
    <div class="preview-modal__layout">
      <div class="preview-modal__viewer">
        <iframe class="preview-modal__frame" data-preview-frame title="External preview"></iframe>
        <img class="preview-modal__image" data-preview-image-viewer alt="" hidden>
        <div class="preview-modal__fallback" data-preview-fallback hidden>
          <p class="eyebrow">Preview</p>
          <h2>Inline preview is not available for this source.</h2>
          <p>Some external websites block embedded views. You can stay here, read the summary, and open the source only if you want to.</p>
        </div>
      </div>
      <aside class="preview-modal__meta">
        <p class="eyebrow">External Source</p>
        <h2 id="preview-modal-title" data-preview-title>Preview</h2>
        <p class="preview-modal__origin" data-preview-origin></p>
        <p class="preview-modal__summary" data-preview-summary></p>
        <div class="preview-modal__actions">
          <a class="project-action" data-preview-open-source href="#" target="_blank" rel="noopener noreferrer">
            <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i>
            Open source
          </a>
        </div>
      </aside>
    </div>
  </div>
</div>
