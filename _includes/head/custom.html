<script>
  (function () {
    try {
      var storedTheme = localStorage.getItem("jackie-theme");
      if (storedTheme === "light") {
        document.documentElement.classList.add("theme-light");
      }
    } catch (error) {}
  })();
</script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    var themeToggle = document.querySelector("[data-theme-toggle]");
    var lastPreviewTrigger = null;
    var shouldRestorePreviewFocus = false;
    var cardLinkSelector = ".news-card--link, .update-card--link, .showcase-card, .blog-card";
    var cardFocusResetKey = "jackie-reset-card-focus";

    function rememberCardFocusReset() {
      try {
        sessionStorage.setItem(cardFocusResetKey, "1");
      } catch (error) {}
    }

    function clearRestoredCardFocus() {
      var shouldClear = false;

      try {
        shouldClear = sessionStorage.getItem(cardFocusResetKey) === "1";
      } catch (error) {}

      if (!shouldClear) return;

      if (
        document.activeElement &&
        typeof document.activeElement.matches === "function" &&
        document.activeElement.matches(cardLinkSelector)
      ) {
        document.activeElement.blur();
      }

      try {
        sessionStorage.removeItem(cardFocusResetKey);
      } catch (error) {}
    }

    window.addEventListener("pageshow", function () {
      window.requestAnimationFrame(clearRestoredCardFocus);
    });

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState !== "visible") return;
      window.requestAnimationFrame(clearRestoredCardFocus);
    });

    document.querySelectorAll(cardLinkSelector).forEach(function (link) {
      link.addEventListener("click", function (event) {
        if (event.defaultPrevented) return;
        if (event.button !== 0) return;
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

        rememberCardFocusReset();
      });
    });

    if (themeToggle) {
      themeToggle.addEventListener("click", function () {
        var isLight = document.documentElement.classList.toggle("theme-light");
        try {
          localStorage.setItem("jackie-theme", isLight ? "light" : "dark");
        } catch (error) {}
      });
    }

    var links = document.querySelectorAll("a[href]");

    links.forEach(function (link) {
      var href = link.getAttribute("href");
      if (!href) return;
      if (link.hasAttribute("data-preview-modal")) return;

      if (
        href.charAt(0) === "#" ||
        href.startsWith("mailto:") ||
        href.startsWith("tel:") ||
        href.startsWith("javascript:")
      ) {
        return;
      }

      var url;
      try {
        url = new URL(link.href, window.location.href);
      } catch (error) {
        return;
      }

      if (url.origin === window.location.origin) return;

      link.setAttribute("target", "_blank");

      var relValues = (link.getAttribute("rel") || "")
        .split(/\s+/)
        .filter(Boolean);
      if (!relValues.includes("noopener")) relValues.push("noopener");
      if (!relValues.includes("noreferrer")) relValues.push("noreferrer");
      link.setAttribute("rel", relValues.join(" "));
    });

    var navLinks = document.querySelectorAll(".visible-links a[href]");
    var currentPath = window.location.pathname.replace(/index\.html$/, "");

    if (currentPath.length > 1 && currentPath.endsWith("/")) {
      currentPath = currentPath.slice(0, -1);
    }

    var currentSection = currentPath.split("/").filter(Boolean)[0] || "";

    navLinks.forEach(function (link) {
      var linkPath;

      try {
        linkPath = new URL(link.href, window.location.href).pathname.replace(/index\.html$/, "");
      } catch (error) {
        return;
      }

      if (linkPath.length > 1 && linkPath.endsWith("/")) {
        linkPath = linkPath.slice(0, -1);
      }

      var linkSection = linkPath.split("/").filter(Boolean)[0] || "";
      var isActive = linkSection ? currentSection === linkSection : currentPath === "";
      link.classList.toggle("is-active", isActive);
    });

    var blogSearchInput = document.querySelector("[data-blog-search]");
    var blogCards = Array.prototype.slice.call(document.querySelectorAll("[data-blog-card]"));
    var blogEmptyState = document.querySelector("[data-blog-empty]");
    var blogCount = document.querySelector("[data-blog-count]");

    function updateBlogSearch() {
      var query = blogSearchInput.value.trim().toLowerCase();
      var visibleCount = 0;

      blogCards.forEach(function (card) {
        var searchText = (card.getAttribute("data-search-text") || card.textContent || "").toLowerCase();
        var isVisible = query === "" || searchText.indexOf(query) !== -1;
        card.hidden = !isVisible;
        if (isVisible) visibleCount += 1;
      });

      if (blogEmptyState) {
        blogEmptyState.hidden = visibleCount !== 0;
      }

      if (blogCount) {
        blogCount.textContent = visibleCount + " " + (visibleCount === 1 ? "note" : "notes");
      }
    }

    if (blogSearchInput && blogCards.length > 0) {
      blogSearchInput.addEventListener("input", updateBlogSearch);
      updateBlogSearch();
    }

    function getBlogEmbedDocument(frame) {
      try {
        return frame.contentDocument || frame.contentWindow.document;
      } catch (error) {
        return null;
      }
    }

    function resizeBlogEmbed(frame) {
      try {
        var frameDocument = getBlogEmbedDocument(frame);
        if (!frameDocument) return;

        var frameBody = frameDocument.body;
        var frameRoot = frameDocument.documentElement;
        var nextHeight = Math.max(
          frameBody ? frameBody.scrollHeight : 0,
          frameRoot ? frameRoot.scrollHeight : 0
        );

        if (nextHeight > 0) {
          frame.style.height = nextHeight + "px";
        }
      } catch (error) {}
    }

    function getBlogEmbedStickyOffset() {
      var masthead = document.querySelector(".masthead");
      var mastheadBottom = masthead ? masthead.getBoundingClientRect().bottom : 0;
      return Math.max(18, mastheadBottom + 18);
    }

    function resetBlogEmbedStickySidebar(sidebar) {
      sidebar.style.removeProperty("transform");
      sidebar.style.removeProperty("max-height");
      sidebar.style.removeProperty("will-change");
    }

    function updateBlogEmbedStickySidebar(frame) {
      var frameDocument = getBlogEmbedDocument(frame);
      if (!frameDocument || !frame.contentWindow) return;

      var sidebar = frameDocument.querySelector("[data-blog-embed-sticky-sidebar], .toc");
      if (!sidebar) return;

      var boundary = frameDocument.querySelector("[data-blog-embed-sticky-boundary]") || sidebar.parentElement;
      if (!boundary) {
        resetBlogEmbedStickySidebar(sidebar);
        return;
      }

      var frameRect = frame.getBoundingClientRect();
      if (frameRect.width <= 820 || window.innerWidth <= 820) {
        resetBlogEmbedStickySidebar(sidebar);
        return;
      }

      var originalTransform = sidebar.style.transform;
      sidebar.style.removeProperty("transform");

      var sidebarRect = sidebar.getBoundingClientRect();
      var boundaryRect = boundary.getBoundingClientRect();
      var frameScrollY = frame.contentWindow.scrollY || 0;
      var sidebarTop = sidebarRect.top + frameScrollY;
      var boundaryBottom = boundaryRect.bottom + frameScrollY;
      var stickyTop = getBlogEmbedStickyOffset();
      var targetTopInFrame = stickyTop - frameRect.top;
      var shift = Math.max(0, targetTopInFrame - sidebarTop);
      var maxShift = Math.max(0, boundaryBottom - sidebarTop - sidebarRect.height);

      shift = Math.min(shift, maxShift);

      if (shift > 0) {
        sidebar.style.transform = "translateY(" + Math.round(shift) + "px)";
      } else if (originalTransform) {
        sidebar.style.removeProperty("transform");
      }

      sidebar.style.maxHeight = Math.max(220, Math.round(window.innerHeight - stickyTop - 18)) + "px";
      sidebar.style.willChange = "transform";
    }

    var blogEmbedFrames = Array.prototype.slice.call(document.querySelectorAll("[data-blog-embed-frame]"));
    var blogEmbedStickyFrameQueued = false;

    function updateBlogEmbedStickySidebars() {
      blogEmbedStickyFrameQueued = false;
      blogEmbedFrames.forEach(updateBlogEmbedStickySidebar);
    }

    function scheduleBlogEmbedStickySidebars() {
      if (blogEmbedStickyFrameQueued) return;
      blogEmbedStickyFrameQueued = true;
      window.requestAnimationFrame(updateBlogEmbedStickySidebars);
    }

    blogEmbedFrames.forEach(function (frame) {
      frame.addEventListener("load", function () {
        resizeBlogEmbed(frame);
        scheduleBlogEmbedStickySidebars();
      });

      resizeBlogEmbed(frame);
    });

    if (blogEmbedFrames.length > 0) {
      window.addEventListener("scroll", scheduleBlogEmbedStickySidebars, { passive: true });
      window.addEventListener("resize", function () {
        blogEmbedFrames.forEach(resizeBlogEmbed);
        scheduleBlogEmbedStickySidebars();
      });
      scheduleBlogEmbedStickySidebars();
    }

    function getPreviewUrl(sourceUrl) {
      if (!sourceUrl) return "";

      try {
        var parsed = new URL(sourceUrl, window.location.href);

        if (parsed.hostname === "drive.google.com") {
          var driveMatch = parsed.pathname.match(/\/file\/d\/([^/]+)/);
          if (driveMatch && driveMatch[1]) {
            return "https://drive.google.com/file/d/" + driveMatch[1] + "/preview";
          }
        }

        if (parsed.origin === window.location.origin || parsed.hostname === "jackie-jiaqi-yin.github.io") {
          return parsed.href;
        }
      } catch (error) {
        return "";
      }

      return "";
    }

    var previewDialog = document.querySelector("[data-preview-dialog]");
    var previewFrame = previewDialog ? previewDialog.querySelector("[data-preview-frame]") : null;
    var previewImageViewer = previewDialog ? previewDialog.querySelector("[data-preview-image-viewer]") : null;
    var previewTitle = previewDialog ? previewDialog.querySelector("[data-preview-title]") : null;
    var previewSummary = previewDialog ? previewDialog.querySelector("[data-preview-summary]") : null;
    var previewOrigin = previewDialog ? previewDialog.querySelector("[data-preview-origin]") : null;
    var previewFallback = previewDialog ? previewDialog.querySelector("[data-preview-fallback]") : null;
    var previewSourceLink = previewDialog ? previewDialog.querySelector("[data-preview-open-source]") : null;
    var previewCloseButton = previewDialog ? previewDialog.querySelector(".preview-modal__close") : null;

    function closePreviewDialog() {
      if (!previewDialog) return;

      previewDialog.hidden = true;
      previewDialog.setAttribute("aria-hidden", "true");
      document.documentElement.classList.remove("preview-modal-open");
      document.body.classList.remove("preview-modal-open");

      if (previewFrame) {
        previewFrame.setAttribute("src", "about:blank");
      }

      if (previewImageViewer) {
        previewImageViewer.removeAttribute("src");
        previewImageViewer.setAttribute("alt", "");
      }

      if (lastPreviewTrigger) {
        if (shouldRestorePreviewFocus) {
          lastPreviewTrigger.focus();
        }
        lastPreviewTrigger = null;
        shouldRestorePreviewFocus = false;
      }
    }

    function openPreviewDialog(link) {
      if (!previewDialog || !previewTitle || !previewSummary) return;

      var sourceUrl = link.getAttribute("href");
      var title = link.getAttribute("data-preview-title") || link.textContent.trim();
      var summary = link.getAttribute("data-preview-summary") || "";
      var previewImageUrl = link.getAttribute("data-preview-image") || "";
      var previewUrl = link.getAttribute("data-preview-url") || getPreviewUrl(sourceUrl);
      var hasPreviewImage = Boolean(previewImageUrl);
      var canEmbed = Boolean(previewUrl);
      var origin = "";

      try {
        origin = sourceUrl ? new URL(sourceUrl, window.location.href).hostname : "";
      } catch (error) {
        origin = "";
      }

      previewTitle.textContent = title;
      previewSummary.textContent = summary;
      if (previewOrigin) {
        previewOrigin.textContent = origin ? "Source: " + origin : "Inline preview";
      }
      if (previewSourceLink) {
        previewSourceLink.setAttribute("href", sourceUrl || "#");
        previewSourceLink.hidden = !sourceUrl;
      }

      if (previewFrame) {
        previewFrame.hidden = hasPreviewImage || !canEmbed;
        previewFrame.setAttribute("src", !hasPreviewImage && canEmbed ? previewUrl : "about:blank");
      }

      if (previewImageViewer) {
        previewImageViewer.hidden = !hasPreviewImage;
        if (hasPreviewImage) {
          previewImageViewer.setAttribute("src", previewImageUrl);
          previewImageViewer.setAttribute("alt", title + " preview image");
        } else {
          previewImageViewer.removeAttribute("src");
          previewImageViewer.setAttribute("alt", "");
        }
      }

      if (previewFallback) {
        previewFallback.hidden = hasPreviewImage || canEmbed;
      }

      previewDialog.hidden = false;
      previewDialog.setAttribute("aria-hidden", "false");
      document.documentElement.classList.add("preview-modal-open");
      document.body.classList.add("preview-modal-open");

      if (previewCloseButton) {
        previewCloseButton.focus();
      }
    }

    document.querySelectorAll("[data-preview-modal]").forEach(function (link) {
      link.addEventListener("click", function (event) {
        if (event.defaultPrevented) return;
        if (event.button !== 0) return;
        if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

        event.preventDefault();
        lastPreviewTrigger = link;
        shouldRestorePreviewFocus = event.detail === 0;
        openPreviewDialog(link);
      });
    });

    if (previewDialog) {
      previewDialog.querySelectorAll("[data-preview-close]").forEach(function (element) {
        element.addEventListener("click", closePreviewDialog);
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !previewDialog.hidden) {
          closePreviewDialog();
        }
      });
    }

    document.querySelectorAll("[data-project-carousel-root]").forEach(function (carouselRoot) {
      var slides = Array.prototype.slice.call(
        carouselRoot.querySelectorAll("[data-project-carousel-slide]")
      );
      var carouselFrame = carouselRoot.closest(".project-demo-frame");
      var controls = carouselFrame
        ? Array.prototype.slice.call(
            carouselFrame.querySelectorAll("[data-project-carousel-dot]")
          )
        : [];
      var interval = Number(carouselRoot.getAttribute("data-carousel-interval")) || 5000;
      var currentIndex = 0;
      var timerId = null;

      if (slides.length <= 1) return;

      function setActiveSlide(nextIndex) {
        var normalizedIndex = ((nextIndex % slides.length) + slides.length) % slides.length;
        currentIndex = normalizedIndex;

        slides.forEach(function (slide, index) {
          var isActive = index === normalizedIndex;
          slide.classList.toggle("is-active", isActive);
          slide.hidden = !isActive;
        });

        controls.forEach(function (dot, index) {
          var isActive = index === normalizedIndex;
          dot.classList.toggle("is-active", isActive);
          dot.setAttribute("aria-current", isActive ? "true" : "false");
        });
      }

      function stopAutoRotate() {
        if (!timerId) return;
        window.clearInterval(timerId);
        timerId = null;
      }

      function startAutoRotate() {
        stopAutoRotate();
        timerId = window.setInterval(function () {
          setActiveSlide(currentIndex + 1);
        }, interval);
      }

      controls.forEach(function (dot) {
        dot.addEventListener("click", function () {
          var dotIndex = Number(dot.getAttribute("data-project-carousel-index"));
          if (!Number.isFinite(dotIndex)) return;
          setActiveSlide(dotIndex);
          startAutoRotate();
        });
      });

      carouselRoot.addEventListener("mouseenter", stopAutoRotate);
      carouselRoot.addEventListener("mouseleave", startAutoRotate);
      carouselRoot.addEventListener("focusin", stopAutoRotate);
      carouselRoot.addEventListener("focusout", function (event) {
        if (!carouselRoot.contains(event.relatedTarget)) {
          startAutoRotate();
        }
      });

      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "hidden") {
          stopAutoRotate();
        } else {
          startAutoRotate();
        }
      });

      setActiveSlide(0);
      startAutoRotate();
    });
  });
</script>

<!-- end custom head snippets -->
